# ============================================================================
# CPU-friendly test configuration
# ============================================================================
# This is a minimal configuration for testing the pipeline on CPU
# Uses tiny dataset and minimal parameters for quick validation

data_dir: data
output_dir: artifacts/mt5_base_full_3epochs_with_retrieval
submission_path: artifacts/mt5_base_full_3epochs_with_retrieval/submission.csv

model_name: google/mt5-base

max_input_length: 128
max_target_length: 256

prompt_style: lang_prefix
retrieval_augment: true

optimizer: adamw
learning_rate: 5.0e-4
num_train_epochs: 3
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 2
# Reduce memory pressure on CPU even for the tiny test.
# (We can’t use max_train_steps/max_eval_steps here because Config doesn’t define them.)

weight_decay: 0.01
warmup_ratio: 0.05
label_smoothing_factor: 0.0
seed: 42

bf16_if_supported: true
gradient_checkpointing: true

val_size: 0.1
# max_train_samples: 2000  # Removed for full dataset training
eval_strategy: epoch
# CPU checkpoint saving can easily OOM on RAM. Disable saving for the quick smoke-test.
save_strategy: "epoch"
load_best_model_at_end: true
metric_for_best_model: eval_rougeL
greater_is_better: true
early_stopping_patience: 1
predict_with_generate: true
eval_max_samples: 100

num_beams: 2
length_penalty: 1.0
no_repeat_ngram_size: 3

hybrid_fallback: false
hybrid_min_gen_chars: 5

run_name: mt5_base_full_3epochs_with_retrieval
notes: Fast training: mt5-base, full dataset, 3 epochs with retrieval augmentation
