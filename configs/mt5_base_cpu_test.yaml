# ============================================================================
# CPU-friendly test configuration
# ============================================================================
# This is a minimal configuration for testing the pipeline on CPU
# Uses tiny dataset and minimal parameters for quick validation

data_dir: data
output_dir: artifacts/mt5_small_500samples_3epochs
submission_path: artifacts/mt5_small_500samples_3epochs/submission.csv

model_name: google/mt5-small

max_input_length: 64
max_target_length: 128

prompt_style: lang_prefix
retrieval_augment: false

optimizer: adamw
learning_rate: 5.0e-4
num_train_epochs: 3
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 1
# Reduce memory pressure on CPU even for the tiny test.
# (We can’t use max_train_steps/max_eval_steps here because Config doesn’t define them.)

weight_decay: 0.01
warmup_ratio: 0.05
label_smoothing_factor: 0.0
seed: 42

bf16_if_supported: false
gradient_checkpointing: true

val_size: 0.5
max_train_samples: 500
eval_strategy: epoch
# CPU checkpoint saving can easily OOM on RAM. Disable saving for the quick smoke-test.
save_strategy: "epoch"
load_best_model_at_end: true
metric_for_best_model: eval_rougeL
greater_is_better: true
early_stopping_patience: 1
predict_with_generate: true
eval_max_samples: 100

num_beams: 2
length_penalty: 1.0
no_repeat_ngram_size: 3

hybrid_fallback: false
hybrid_min_gen_chars: 5

run_name: mt5_small_500samples_3epochs
notes: Medium-scale CPU test with 500 samples and 3 epochs
